name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (engine, data adapters, API, rule files)
        run: pnpm test
      - name: Server bundle for Vercel builds and starts
        run: |
          pnpm --filter @vergunbuy/api run build:vercel
          node -e "import('./.vercel/output/functions/api.func/index.mjs').then(m => { if (typeof m.default !== 'function') process.exit(1); console.log('bundle ok') })"
