name: Check the live server after each Vercel deployment

# Vercel reports each deployment back to GitHub as a commit status named "Vercel". When one on
# main succeeds, this asks
# the live server the three things the website depends on. A red run here means the site's rule
# checks are broken right now, even though the build itself succeeded.
on:
  status:
  workflow_dispatch:

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' && github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    steps:
      - name: Ask the live server
        env:
          SERVER: https://vergunbuy-inky.vercel.app
        run: |
          set -e
          curl -fsS "$SERVER/api/health" | tee health.json; echo
          curl -fsS "$SERVER/api/dso/status" | tee status.json; echo
          jq -e '.data.prod == true' status.json > /dev/null || { echo "::error::DSO key is not configured on Vercel"; exit 1; }
          curl -fsS "$SERVER/api/dso/regelingen?x=86549.8&y=376598.204" > regelingen.json
          jq '{complete: .data.complete, documents: (.data.regelingen.documents | length), drafts: (.data.drafts.documents | length), calls: (.data.calls | length)}' regelingen.json
          jq -e '.data.complete == true and (.data.regelingen.documents | length) > 0' regelingen.json > /dev/null \
            || { echo "::error::The DSO search is incomplete or empty"; jq '.data.regelingen.error // .data.drafts.error' regelingen.json; exit 1; }
          curl -fsS -X POST "$SERVER/api/rp/zoning" -H "content-type: application/json" \
            -d '{"ring":[[84900,383320],[84920,383320],[84920,383340],[84900,383340]]}' > zoning.json
          jq '{complete: .data.complete, plans: (.data.plans | length), objects: (.data.objects | length)}' zoning.json
          jq -e '.data.complete == true and (.data.plans | length) > 0' zoning.json > /dev/null \
            || { echo "::error::The zoning plan search is incomplete or empty"; exit 1; }
