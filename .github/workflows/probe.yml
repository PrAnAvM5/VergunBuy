name: Probe data services (manual)

# Records real responses from PDOK into fixtures/probe and commits them.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe.mjs && node scripts/probe2.mjs
      - name: Commit recorded responses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/probe fixtures/probe2
          git commit -m "Record PDOK probe responses" || echo "nothing to commit"
          git push
