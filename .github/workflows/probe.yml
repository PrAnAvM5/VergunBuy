name: Probe data services (manual)

# Records real responses from PDOK into fixtures/probe and commits them.
on:
  workflow_dispatch:
    inputs:
      script:
        description: Probe script to run (scripts/<name>.mjs)
        default: probe3

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node "scripts/${{ inputs.script }}.mjs"
      - name: Commit recorded responses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures
          git commit -m "Record PDOK probe responses" || echo "nothing to commit"
          git pull --rebase && git push
