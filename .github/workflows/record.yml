name: Record address (manual)

# Runs the real pipeline for one address and commits every response to fixtures/<town-street-number>/.
on:
  workflow_dispatch:
    inputs:
      addresses:
        description: 'Addresses as postcode:number[:addition], space separated, e.g. "4631CC:1 4641HR:10:a"'
        required: true

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/record.ts $ADDRESSES
        env:
          ADDRESSES: ${{ inputs.addresses }}
      - name: Commit recording
        env:
          ADDRESSES: ${{ inputs.addresses }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures
          git commit -m "Record addresses: $ADDRESSES" || echo "nothing to commit"
          git pull --rebase && git push
